name: Deploy React Application

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          printf '%s' "$DOCKER_PASSWORD" | docker login \
            --username "$DOCKER_USERNAME" \
            --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/shopnest-frontend:latest .

      - name: Publish Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/shopnest-frontend:latest


  deploy:
    needs: build
    runs-on: self-hosted

    steps:

      - name: Login to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          printf '%s' "$DOCKER_PASSWORD" | docker login \
            --username "$DOCKER_USERNAME" \
            --password-stdin

      - name: Pull Image from Docker Hub
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/shopnest-frontend:latest

      - name: Remove Existing Container
        run: |
          docker rm -f shopnest-frontend-container || true

      - name: Run Frontend Container
        run: |
          docker run -d \
            -p 80:80 \
            --name shopnest-frontend-container \
            ${{ secrets.DOCKER_USERNAME }}/shopnest-frontend:latest